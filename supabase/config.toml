
[functions.join-waitlist]
enabled = true
verify_jwt = true
import_map = "./functions/join-waitlist/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/join-waitlist/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/join-waitlist/*.html" ]

[functions.verify-email]
enabled = true
# Called from the SPA with Authorization: Bearer <anon key>
verify_jwt = true
import_map = "./functions/verify-email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/verify-email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/verify-email/*.html" ]
